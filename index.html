<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор времени">
<meta name="theme-color" content="#101827">
<title>Калькулятор времени</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{
  min-height:100vh;padding:18px 14px 30px;
  padding-top:calc(18px + env(safe-area-inset-top));
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
  background:linear-gradient(135deg,#08111f,#162338 55%,#070d18);
  color:#fff;transition:.25s;
}
body.day{background:linear-gradient(135deg,#dbeafe,#f8fafc 55%,#e0e7ff);color:#172033}
.app{width:100%;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.title{font-size:25px;font-weight:800;letter-spacing:-.5px}
.sub{font-size:13px;opacity:.62;margin-top:4px}
.theme{width:48px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.1);color:inherit;font-size:21px}
body.day .theme{background:rgba(0,0,0,.07)}
.card{
  border-radius:25px;padding:18px;background:rgba(17,24,39,.76);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 18px 50px rgba(0,0,0,.25);transition:.25s
}
body.day .card{background:rgba(255,255,255,.76);border-color:rgba(15,23,42,.1);box-shadow:0 18px 50px rgba(30,41,59,.14)}
.label{font-size:13px;opacity:.7;margin-bottom:8px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{padding:14px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}
body.day .box{background:rgba(15,23,42,.045);border-color:rgba(15,23,42,.08)}

.time-input{
  display:block;width:100%;height:54px;border-radius:14px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(10,18,32,.8);color:#fff;
  padding:0 10px;font-size:22px;font-weight:700;
  text-align:center;outline:none;
  -webkit-appearance:none;appearance:none;
  -webkit-user-select:text;user-select:text;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
body.day .time-input{background:rgba(255,255,255,.9);color:#172033;border-color:rgba(15,23,42,.13)}
.time-input:focus{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.14)}
.time-input::placeholder{color:rgba(255,255,255,.38)}
body.day .time-input::placeholder{color:rgba(23,32,51,.38)}

.calc{width:100%;height:56px;margin-top:14px;border:0;border-radius:17px;background:#3b82f6;color:#fff;font-size:17px;font-weight:800}
.calc:active{transform:scale(.99)}
.result{margin-top:14px;padding:18px;text-align:center;border-radius:19px;background:rgba(59,130,246,.12);border:1px solid rgba(96,165,250,.2)}
.result small{opacity:.65}.result strong{display:block;font-size:31px;margin-top:4px}
.settings{margin-top:14px}.settings-title{font-size:16px;font-weight:800;margin-bottom:12px}
.setting{margin:13px 0}.setting-title{font-size:13px;opacity:.72;margin-bottom:7px}
select{width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(20,30,46,.88);color:#fff;padding:0 12px;font-size:15px;outline:none}
body.day select{background:rgba(255,255,255,.92);color:#172033;border-color:rgba(15,23,42,.12)}
input[type=range]{width:100%;accent-color:#3b82f6}
.file{width:100%;padding:12px;border-radius:14px;border:1px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:inherit}
body.day .file{border-color:rgba(15,23,42,.15);background:rgba(15,23,42,.03)}
.reset{width:100%;height:48px;margin-top:10px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:transparent;color:inherit;font-weight:700}
@media(max-width:390px){body{padding-left:10px;padding-right:10px}.card{padding:14px}.times{gap:8px}.box{padding:11px}.title{font-size:22px}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div>
      <div class="title">⏱️ Калькулятор времени</div>
      <div class="sub">Введите 4 цифры: например 1545 → 15:45</div>
    </div>
    <button class="theme" id="theme" type="button" aria-label="День/ночь">☀️</button>
  </div>

  <section class="card" id="card">
    <div class="times">
      <div class="box">
        <div class="label">Начало</div>
        <input id="start" class="time-input" type="tel" inputmode="numeric"
               autocomplete="off" autocorrect="off" autocapitalize="off"
               maxlength="5" value="15:00" aria-label="Время начала">
      </div>
      <div class="box">
        <div class="label">Конец</div>
        <input id="end" class="time-input" type="tel" inputmode="numeric"
               autocomplete="off" autocorrect="off" autocapitalize="off"
               maxlength="5" value="13:45" aria-label="Время окончания">
      </div>
    </div>

    <button class="calc" id="calculate" type="button">Рассчитать</button>

    <div class="result" aria-live="polite">
      <small>Прошло времени</small>
      <strong id="result">1 час 45 минут</strong>
    </div>

    <div class="settings">
      <div class="settings-title">Настройки</div>

      <div class="setting">
        <div class="setting-title">Стиль</div>
        <select id="style">
          <option value="glass">Стеклянный</option>
          <option value="soft">Мягкий</option>
          <option value="neon">Неоновый</option>
          <option value="classic">Классический</option>
        </select>
      </div>

      <div class="setting">
        <div class="setting-title">Прозрачность</div>
        <input id="opacity" type="range" min="45" max="95" value="76">
      </div>

      <div class="setting">
        <div class="setting-title">Яркость</div>
        <input id="brightness" type="range" min="70" max="120" value="100">
      </div>

      <div class="setting">
        <div class="setting-title">Фон</div>
        <select id="wallpaper">
          <option value="none">Без обоев</option>
          <option value="palms">🌴 Пальмы и море</option>
          <option value="mountains">🏔️ Горы</option>
          <option value="christmas">🎄 Новый год</option>
          <option value="winter">❄️ Зимняя ночь</option>
          <option value="stars">🌌 Ночное небо</option>
        </select>
      </div>

      <div class="setting">
        <div class="setting-title">Свои обои</div>
        <input class="file" id="customWallpaper" type="file" accept="image/*">
      </div>

      <button class="reset" id="reset" type="button">Сбросить настройки</button>
    </div>
  </section>
</main>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const body=document.body, card=$("card");

  function formatTime(el){
    // Ровно четыре цифры: ЧЧММ. Лишние цифры сразу отбрасываются.
    let digits=(el.value||"").replace(/\D/g,"").slice(0,4);
    if(digits.length<=2){
      el.value=digits;
    }else{
      el.value=digits.slice(0,2)+":"+digits.slice(2);
    }
  }

  function parseTime(v){
    const m=(v||"").match(/^(\d{1,2}):(\d{2})$/);
    if(!m)return null;
    const h=Number(m[1]), min=Number(m[2]);
    if(h>23||min>59)return null;
    return h*60+min;
  }

  function word(n,a,b,c){
    const x=n%100,y=n%10;
    if(x>=11&&x<=14)return c;
    if(y===1)return a;
    if(y>=2&&y<=4)return b;
    return c;
  }

  function calculate(){
    formatTime($("start")); formatTime($("end"));
    const a=parseTime($("start").value), b=parseTime($("end").value);
    if(a===null||b===null){$("result").textContent="Проверьте время";return}
    let d=b-a; if(d<0)d+=1440;
    const h=Math.floor(d/60), m=d%60;
    if(!h&&!m)$("result").textContent="0 минут";
    else if(!h)$("result").textContent=m+" "+word(m,"минута","минуты","минут");
    else if(!m)$("result").textContent=h+" "+word(h,"час","часа","часов");
    else $("result").textContent=h+" "+word(h,"час","часа","часов")+" "+m+" "+word(m,"минута","минуты","минут");
  }

  ["start","end"].forEach(id=>{
    const el=$(id);
    el.addEventListener("input",function(){
      formatTime(el);
      calculate();
    });
    el.addEventListener("blur",function(){
      const p=parseTime(el.value);
      if(p!==null){
        el.value=String(Math.floor(p/60)).padStart(2,"0")+":"+String(p%60).padStart(2,"0");
      }else if(el.value.replace(/\D/g,"").length===4){
        // Неверное время не оставляем в поле.
        el.value="00:00";
      }
      calculate();
    });
  });
  $("calculate").addEventListener("click",calculate);

  $("theme").addEventListener("click",function(){
    body.classList.toggle("day");
    this.textContent=body.classList.contains("day")?"🌙":"☀️";
  });

  $("opacity").addEventListener("input",function(){
    const a=Number(this.value)/100;
    card.style.background=body.classList.contains("day")?"rgba(255,255,255,"+a+")":"rgba(17,24,39,"+a+")";
  });

  $("brightness").addEventListener("input",function(){card.style.filter="brightness("+this.value+"%)"});

  $("style").addEventListener("change",function(){
    if(this.value==="glass"){
      card.style.borderRadius="25px";card.style.backdropFilter="blur(20px)";card.style.webkitBackdropFilter="blur(20px)";card.style.boxShadow="0 18px 50px rgba(0,0,0,.25)";
    }else if(this.value==="soft"){
      card.style.borderRadius="32px";card.style.backdropFilter="blur(25px)";card.style.webkitBackdropFilter="blur(25px)";card.style.boxShadow="0 20px 55px rgba(0,0,0,.18)";
    }else if(this.value==="neon"){
      card.style.borderRadius="18px";card.style.backdropFilter="blur(16px)";card.style.webkitBackdropFilter="blur(16px)";card.style.boxShadow="0 0 30px rgba(59,130,246,.3)";
    }else{
      card.style.borderRadius="10px";card.style.backdropFilter="none";card.style.webkitBackdropFilter="none";card.style.boxShadow="0 10px 25px rgba(0,0,0,.2)";
    }
  });

  $("wallpaper").addEventListener("change",function(){
    const bg={
      none:"linear-gradient(135deg,#08111f,#162338 55%,#070d18)",
      palms:"linear-gradient(135deg,#075985,#0ea5a4 50%,#164e63)",
      mountains:"linear-gradient(135deg,#111827,#334155 50%,#0f172a)",
      christmas:"linear-gradient(135deg,#3f0d12,#7f1d1d 48%,#064e3b)",
      winter:"linear-gradient(135deg,#020617,#172554 55%,#0f172a)",
      stars:"radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 80% 30%,#60a5fa 0 1px,transparent 2px),linear-gradient(135deg,#020617,#111827 60%,#1e1b4b)"
    };
    body.style.background=bg[this.value];
  });

  $("customWallpaper").addEventListener("change",function(){
    const file=this.files&&this.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      body.style.backgroundImage="url('"+e.target.result+"')";
      body.style.backgroundSize="cover";body.style.backgroundPosition="center";body.style.backgroundAttachment="fixed";
    };
    reader.readAsDataURL(file);
  });

  $("reset").addEventListener("click",function(){
    $("start").value="12:00";$("end").value="13:45";
    $("style").value="glass";$("opacity").value="76";$("brightness").value="100";$("wallpaper").value="none";$("customWallpaper").value="";
    body.classList.remove("day");$("theme").textContent="☀️";
    body.style.backgroundImage="";body.style.backgroundSize="";body.style.backgroundPosition="";body.style.backgroundAttachment="";
    body.style.background="linear-gradient(135deg,#08111f,#162338 55%,#070d18)";
    card.style.background="rgba(17,24,39,.76)";card.style.filter="none";card.style.borderRadius="25px";
    card.style.backdropFilter="blur(20px)";card.style.webkitBackdropFilter="blur(20px)";card.style.boxShadow="0 18px 50px rgba(0,0,0,.25)";
    calculate();
  });

  // Всегда начинаем с тёмной темы.
  body.classList.remove("day");
  $("theme").textContent="☀️";
  calculate();
})();
</script>
</body>
</html>
